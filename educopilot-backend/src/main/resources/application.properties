# ===== Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/educopilot
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Server =====
server.port=8080

# ===== JWT =====
# 256-bit+ secret. Replace this with your own long random string before real use.
# Generate one with: openssl rand -base64 32
jwt.secret=ReplaceThisWithALongRandomBase64SecretKeyThatIsAtLeast32BytesLong
# 24 hours in milliseconds
jwt.expiration=86400000
